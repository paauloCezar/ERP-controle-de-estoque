<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Organize seu estoque" />
    <meta name="keywords" content="Organização, controle." />
    <meta name="author" content="Guilherme Tyszkouski" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERP CONTROLE ESTOQUE</title>
    <link rel="stylesheet" href="../pages/index.css" />
    <link rel="shortcut icon" href="/favicon" />
    <script src="./scripts/login.js" defer></script>
    <script src="./scripts/deashbord.js" defer></script>
  </head>

  <body class="body">
    <div class="page">
      <header class="header">
        <img
          src="../images/image-login.png"
          class="header_image-login"
          alt="imagem de fundo login"
        />
      </header>

      <main class="content">
        <div class="menu">
          <h2 class="menu__title">Bem-vindo!</h2>
          <p class="menu__paragraph">Entre para acessar o sistema</p>

          <form id="menu__loginForm">
            <div class="menu__login_input-group">
              <label for="usuario">Usuário</label>
              <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                required
              />
            </div>

            <div class="menu__login_input-group">
              <label for="senha">Senha</label>
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
              />
            </div>

            <div id="menu__mensagemErro" class="error-message"></div>
            <button type="submit" class="menu__btn-entrar">Entrar</button>

            <p class="menu__signup-text">
              Primeiro acesso?
              <a href="#" id="btnIrParaCadastro">Cadastre-se</a>
            </p>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
